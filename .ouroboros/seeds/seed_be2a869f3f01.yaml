goal: 재판정(Judge Me) 프로젝트에 Nuxt UI 기반 디자인 시스템을 확립하고, 그 위에 가입/로그인 → 자소서 등록 → 평가 큐 클레임
  → 평가 제출 → 마이페이지 진행률까지의 핵심 루프 화면을 Playwright E2E로 검증되는 수준까지 구현한다
task_type: code
brownfield_context:
  project_type: brownfield
  context_references:
  - path: /Volumes/external_ssd/side-projects/judge-me
    role: primary
    summary: 재판정 프로젝트 저장소. 백엔드 API(Nuxt 4 + Prisma + PostgreSQL) 구현 완료, 프론트엔드 UI 미구현
  - path: docs/PRD.md
    role: reference
    summary: 제품 요구사항 문서. 스택(TypeScript/Nuxt) 확정 근거
  - path: docs/api-spec.md
    role: reference
    summary: 프론트엔드가 소비할 백엔드 API 계약
  - path: docs/data-model.md
    role: reference
    summary: 자소서 제출물, 평가 큐, 평가, 크레딧 등 데이터 모델
  - path: docs/guidelines/stack/typescript.md
    role: reference
    summary: Nuxt.js/TypeScript 스택 지침 - 버전, 구조, 네이밍, 린트, 테스트, 안티패턴
  - path: docs/guidelines/principles/code-standards.md
    role: reference
    summary: 네이밍·함수·주석·포맷 코드 표준
  - path: AGENTS.md
    role: reference
    summary: 저장소 작업 진입점 문서 및 지침 맵
  existing_patterns:
  - Nuxt 4 서버 라우트 + Prisma 기반 백엔드 API 구조
  - Vitest 통합 테스트 60건 수준의 검증 엄격도 유지
  - "인증은 nuxt-auth-utils의 httpOnly sealed cookie 세션 기반이다(JWT 아님). server/api/auth/*.post.ts가
    setUserSession/clearUserSession을 쓰고, 클라이언트는 같은 모듈의 useUserSession() 컴포저블로 서버 렌더링
    시점부터 반응형으로 로그인 상태를 읽는다. 별도 Pinia 스토어나 토큰 저장소를 두지 않고, 라우트 보호는 Nuxt 미들웨어로 처리한다."
  - 평가 큐 클레임은 FOR UPDATE SKIP LOCKED 기반 동시성 처리
  - "GET /api/submissions/:id, /api/submissions/:id/progress는 소유자 여부만 검사하며, 제출자가 몇 건을
    평가했는지와 무관하게 항상 조회 가능하다 — 상호평가 완료 여부에 따른 게이팅/잠금 UI는 만들지 않는다. '진행률 N/3'은
    단순 정보 라벨이다."
  - docs/guidelines 체계 준수 및 한국어 문서 작성
  - Conventional Commits 커밋 메시지
  - 기능 단위 브랜치 + PR 워크플로우
  existing_dependencies:
  - Nuxt 4
  - TypeScript
  - Prisma
  - PostgreSQL
  - Vitest
  - nuxt-auth-utils
  - Nuxt UI (Tailwind + Reka UI 기반)
  - Tailwind CSS
  - Playwright
constraints:
- 기존 백엔드 API(Nuxt 4 + Prisma + PostgreSQL)는 이미 구현 완료 상태이며 프론트엔드는 이를 소비한다
- 인증 연결은 nuxt-auth-utils의 useUserSession() 컴포저블을 그대로 사용한다. JWT 저장이나 별도 Pinia 스토어를 새로
  만들지 않는다
- 컴포넌트 라이브러리는 Nuxt UI를 채택하고 디자인 토큰은 app.config.ts 커스터마이징으로 관리한다
- /design-system 쇼케이스 페이지는 만들지 않는다
- 데스크톱 우선 레이아웃, 모바일은 기본 반응형 대응만 하고 별도 모바일 전용 UX 플로우는 설계하지 않는다
- 다크모드를 지원한다
- 톤앤매너는 신뢰감 있는 프로페셔널 톤(누가봉/네이비 계열 + 명확한 타이포그래피), 이모지 남발이나 캐주얼 카피 등 가벼운 톤은 지양한다
- 마이페이지 진행률(N/3)은 정보 라벨일 뿐 게이팅/잠금 로직을 추가하지 않는다
- 신뢰점수 체크리스트, 크레딧 이력, 우선매칭권 화면은 이번 범위 밖(후속 작업)
- 지침 문서는 한국어로 작성한다
- 커밋은 Conventional Commits 형식, main 브랜치 직접 push 금지
acceptance_criteria:
- description: 디자인 토큰(컬러/타이포/스페이싱)과 다크모드 설정이 app.config.ts에 반영되어 앱 전역에 적용된다
  semantic_ac_key: ac_5966fa520227e3c2
  verify_command: node -e "const s=require('fs').readFileSync('app.config.ts','utf8');
    if(!/ui\s*:/.test(s)) throw new Error('no ui token block'); if(!/(primary|colors)/.test(s))
    throw new Error('no color token'); console.log('OK')"
  expected_artifacts:
  - app.config.ts
  output_assertion: OK
- description: 컴포넌트 사용 규칙 문서가 4개 절(컬러/타이포/스페이싱 토큰, 화면 요소별 Nuxt UI 컴포넌트 매핑, 로딩/에러/빈
    상태 공통 처리 패턴, 폼 검증 규칙)을 모두 담은 상태로 docs에 존재한다
  semantic_ac_key: ac_0622c38de516d270
  verify_command: 'node -e "const s=require(''fs'').readFileSync(''docs/ui-ux-spec.md'',''utf8'');
    [''토큰'',''컴포넌트 매핑'',''빈 상태'',''폼 검증''].forEach(k=>{if(!s.includes(k)) throw new
    Error(''missing: ''+k)}); console.log(''OK'')"'
  expected_artifacts:
  - docs/ui-ux-spec.md
  output_assertion: OK
- description: 가입/로그인 → 자소서 등록 → 다른 계정으로 큐 클레임 → 평가 제출 → 마이페이지 진행률 1/3 반영까지 하나의 Playwright
    E2E 시나리오가 통과한다
  semantic_ac_key: ac_83a174c75f422e22
  verify_command: npx playwright test --reporter=line
  expected_artifacts:
  - tests/e2e
- description: 핵심 루프 화면 전부가 Nuxt UI 컴포넌트로 구현되어 라우트로 접근 가능하다
  semantic_ac_key: ac_7d4c2c732ea22fdc
  verify_command: npx nuxt build
  expected_artifacts:
  - app/pages
- description: 로딩/에러/빈 상태(큐가 비었을 때, 크레딧 부족으로 등록 실패할 때) 처리가 문서화된 공통 패턴대로 화면에 나타난다
  semantic_ac_key: ac_7b6624fe29575351
  verify_command: npx playwright test --grep "empty|error|빈 상태|에러" --reporter=line
  expected_artifacts:
  - tests/e2e
- description: 프로젝트 린트와 타입 체크가 새 프론트엔드 코드에서 통과한다
  semantic_ac_key: ac_e8df783c992007c8
  verify_command: npm run lint
ontology_schema:
  name: JudgeMeFrontendLoop
  description: 재판정 서비스의 디자인 시스템 산출물과 핵심 사용자 루프 화면, 그리고 각 화면이 소비하는 백엔드 API와 검증 시나리오의
    관계를 표현하는 도메인 모델
  fields:
  - name: design_tokens
    type: object
    description: app.config.ts에 정의된 컬러(누가봉/네이비 계열)/타이포/스페이싱 토큰과 라이트/다크 모드 매핑
    required: true
  - name: component_rules_doc
    type: object
    description: docs에 남기는 컴포넌트 사용 규칙 문서. 토큰, 컴포넌트 매핑, 상태 처리 패턴, 폼 검증 규칙 4개 절로 구성
    required: true
  - name: screens
    type: array
    description: 핵심 루프 화면 목록 - 가입/로그인, 자소서 등록, 평가 큐, 평가 제출, 마이페이지
    required: true
  - name: screen_api_bindings
    type: array
    description: 각 화면이 호출하는 기존 백엔드 API 엔드포인트 매핑
    required: true
  - name: ui_states
    type: array
    description: 화면별 로딩/에러/빈 상태 정의 - 큐 비었음, 크레딧 부족 등록 실패 등
    required: true
  - name: form_validation_rules
    type: array
    description: 자소서 등록·평가 제출·가입 폼의 검증 규칙
    required: true
  - name: e2e_scenario
    type: object
    description: 가입→등록→타 계정 클레임→평가 제출→진행률 1/3 확인으로 이어지는 단일 Playwright 시나리오
    required: true
  - name: reciprocity_progress
    type: number
    description: 마이페이지에 표시되는 상호평가 진행률(완료 평가 건수 / 요구 건수) - 정보 라벨일 뿐 게이팅 아님
    required: true
  - name: theme_mode
    type: string
    description: 라이트/다크 모드 상태
    required: true
  - name: out_of_scope_screens
    type: array
    description: 이번 범위에서 제외된 화면 - 신뢰점수 체크리스트, 크레딧 이력, 우선매칭권
    required: true
evaluation_principles:
- name: 디자인 일관성
  description: 모든 화면이 app.config.ts 토큰과 문서화된 컴포넌트 매핑 규칙을 따르며, 화면마다 임의의 색상/간격/컴포넌트를
    쓰지 않는다
  weight: 0.9
- name: 핵심 루프 완결성
  description: 가입부터 마이페이지 진행률 반영까지 사용자가 중간에 막히지 않고 end-to-end로 통과할 수 있다
  weight: 1.0
- name: 회귀 방지 검증
  description: 백엔드 Vitest 통합테스트와 동일한 엄격도로 Playwright E2E가 핵심 루프를 자동 검증한다
  weight: 0.9
- name: 톤앤매너 적합성
  description: 신뢰감 있는 프로페셔널 톤을 유지하고 지나치게 딱딱하거나 가벼운 표현을 피한다
  weight: 0.6
- name: 범위 절제
  description: 쇼케이스 페이지, 모바일 전용 플로우, 후속 화면 등 합의된 범위 밖 작업을 만들지 않는다
  weight: 0.8
- name: 1인 개발 유지보수성
  description: 기성 라이브러리 기본 제공 기능을 활용하고 불필요한 자체 추상화를 만들지 않는다
  weight: 0.7
exit_conditions:
- name: 핵심 루프 E2E 통과
  description: 디자인 시스템과 핵심 루프 화면이 모두 구현되고 E2E 시나리오가 통과한다
  criteria: app.config.ts 토큰 적용 + docs 규칙 문서 4개 절 존재 + Playwright 단일 시나리오(가입→등록→클레임→평가→진행률
    1/3) 통과 + 린트/빌드 통과
- name: 범위 확정 필요
  description: 합의되지 않은 UI 결정(범위 밖 화면, 모바일 전용 플로우 등)이 필요해져 진행이 막힌다
  criteria: 이번 범위에 없는 화면·플로우 없이는 핵심 루프를 완성할 수 없다고 판단될 때 사용자에게 확인
- name: 백엔드 계약 불일치
  description: 프론트가 필요로 하는 데이터/엔드포인트가 기존 백엔드 API에 없거나 계약이 어긋난다
  criteria: 화면 구현 중 api-spec/data-model 문서와 실제 API 응답이 핵심 루프를 지원하지 못하는 것이 확인될 때
